<!DOCTYPE html>
<html lang="en" class="body-full-height">
  <head>
    <!-- META SECTION -->
    <title>PDS Admin</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="crypto-js/crypto-js.js"></script>
    <script src="js/Encryption.js"></script>
    <script
      type="text/javascript"
      src="js/plugins/jquery/jquery.min.js"
    ></script>

    <meta name="theme-color" content="#ffffff" />
    <!-- END META SECTION -->

    <!-- CSS INCLUDE -->
    <link
      rel="stylesheet"
      type="text/css"
      id="theme"
      href="css/theme-default.css"
    />
    <!-- EOF CSS INCLUDE -->
    <script src="crypto-js/crypto-js.js"></script>
    <script src="js/Encryption.js"></script>

    <script>
      function generateCaptcha() {
        document.getElementById("captchainput").value = "";
        var captchaImg = document.getElementById("captcha_img");
        if (captchaImg) {
          captchaImg.src = "captcha.php?" + Math.random();
        }
      }

      function verifyCaptcha() {
        var readableString = document.getElementById("password").value;
        var csrfToken = document.getElementById("csrf_token").value;
        let encryption = new Encryption();
        var encrypted = encryption.encrypt(readableString, csrfToken);
        document.getElementById("password").value = encrypted;
        return true;
      }
    </script>
    <script>
      // Function to fetch and inject CSRF token
      function injectCSRFToken() {
        fetch("get_token.php") // Request CSRF token from PHP
          .then((response) => response.text())
          .then((token) => {
            // Inject the token into the hidden input field
            document.getElementById("csrf_token").value = token;
          })
          .catch((err) => {
            console.log("Error fetching CSRF token:", err);
          });
      }
      // Call the function when the page loads
      window.onload = injectCSRFToken;
    </script>

    <style>
      #image {
        box-shadow: "black";
        width: 80px;
        font-weight: 600;
        height: 60px;
        color: #fff;
        user-select: none;
        text-decoration: line-through;
        font-style: italic;
        font-size: x-large;
        border: #2798d5 2px solid;
        padding: 10px;
        margin-left: 119px;
      }
      .login-container {
        background-size: cover;
        background-position: center;
        animation: slideshow 12s infinite;
        transition: background-image 1s ease-in-out;
      }

      @keyframes slideshow {
        0%, 100% {
          background-image: url("img/proc1.jpeg");
        }
        33% {
          background-image: url("img/proc2.jpeg");
        }
        66% {
          background-image: url("img/proc3.jpeg");
        }
      }

      .login-body {
        background: #000;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <b
        ><a
          href="Login.html"
          style="
            color: #fff;
            padding: 10px;
            background-color: #000;
            font-size: 30px;
            text-decoration: none;
            border-radius: 10px;
          "
          >Home Page</a
        ></b
      >

      <div class="login-box animated fadeInDown" style="margin-top: -50px">
        <div
          class="login-body"
          style="background-color: #060505"
          autocomplete="off"
        >
          <div class="login-title"><strong>Welcome</strong>, Please login</div>
          <form
            action="api/Login.php"
            class="form-horizontal"
            method="post"
            onsubmit="return verifyCaptcha()"
          >
            <div class="form-group">
              <div class="col-md-12">
                <input
                  type="text"
                  id="username"
                  name="username"
                  class="form-control"
                  placeholder="Username"
                  style="background-color: #2b2929"
                />
              </div>
            </div>
            <div class="form-group">
              <div class="col-md-12">
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="form-control"
                  placeholder="Password"
                  style="background-color: #2b2929"
                  ;
                />
              </div>
            </div>
            <div class="form-group">
              <div class="col-md-12">
                <input
                  type="text"
                  id="captchainput"
                  name="captchainput"
                  class="form-control"
                  placeholder="Captcha Code"
                  required
                  style="background-color: #2b2929"
                  ;
                />
              </div>
            </div>
            <div class="form-group">
              <div class="col-md-12">
                <input
                  type="hidden"
                  id="csrf_token"
                  name="csrf_token"
                  class="form-control"
                />
              </div>
            </div>
            <div class="form-group">
              <div style="display: flex; align-items: center; justify-content: center; gap: 15px;">
                <img id="captcha_img" src="captcha.php" alt="CAPTCHA Image" style="border: 2px solid #2798d5; width: 120px; height: 40px;" />
                <span class="fa fa-refresh" style="font-size: 24px; color: white; cursor: pointer;" onclick="generateCaptcha()"></span>
              </div>
            </div>

            <div class="form-group">
              <center>
                <button class="btn btn-info btn-block" style="width: 50%">
                  Log In
                </button>
              </center>
            </div>
          </form>
        </div>
        <div class="login-footer" style="background-color: #060505">
          <div class="pull-left">
            <!-- <a href="Signup.html"><h5 style="color: #fff">Signup</h5></a> -->
          </div>
          <div class="pull-right">
            <!-- <a href="Reset.html"><h5 style="color: #fff">Reset Password</h5></a> -->
          </div>
        </div>
      </div>
    </div>

    <script>
      generateCaptcha();
    </script>
  </body>
</html>
